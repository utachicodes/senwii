name: Deploy to VPS

# Pushing to main pulls the new commit onto the VPS and rebuilds just the
# senwii app container (not the Caddy container sitting in front of it, so
# the TLS cert/config it holds is never touched by a deploy). Tests run on
# every push and PR; the deploy job only runs after they pass, so a broken
# commit never reaches the live site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      # VPS_SSH_KEY_B64 is the private key, base64-encoded to one line —
      # multi-line secrets are easy to mangle via copy-paste in GitHub's
      # secret box (that broke the first two attempts at this: a stray
      # line-wrap newline landed inside the base64 payload). Stripping every
      # whitespace character before decoding makes this immune to that no
      # matter how the paste reflows it, and the grep after is a loud,
      # key-safe check that decoding actually produced a real key instead of
      # failing silently into an empty/garbage file.
      - name: Decode deploy key
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          echo "decoded key size: $(wc -c < "$RUNNER_TEMP/deploy_key") bytes"
          grep -q "BEGIN OPENSSH PRIVATE KEY" "$RUNNER_TEMP/deploy_key" || { echo "::error::decoded file is not a valid OpenSSH private key — check the VPS_SSH_KEY_B64 secret"; exit 1; }

      # Confirmed root cause of the earlier auth failures: VPS_USER had a
      # trailing newline from copy-pasting a code block, so sshd actually
      # saw the username "root\n" — an invalid user, rejected before the
      # key was even checked. Trim every connection secret the same way,
      # not just the key, so this class of paste mistake can't recur.
      - name: Normalize connection secrets
        id: conn
        run: |
          echo "host=$(printf '%s' "${{ secrets.VPS_HOST }}" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "user=$(printf '%s' "${{ secrets.VPS_USER }}" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.conn.outputs.host }}
          username: ${{ steps.conn.outputs.user }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd /opt/senwii
            git fetch origin
            git merge --ff-only origin/main
            docker compose -f docker-compose.vps.yml up -d --build senwii
            docker image prune -f
