<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fruit Ninja — SenWii</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: #2b1a0c; color: #f5ead6;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .brush { font-family: "Permanent Marker", "Comic Sans MS", cursive; font-weight: 400; }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud { position: absolute; inset: 0; pointer-events: none; }

  /* One .cell per player, laid over that player's viewport. --s scales the
     type down in a narrow/short cell; --tint is the player's blade colour. */
  #cells { position: absolute; inset: 0; }
  .cell { position: absolute; overflow: hidden; --s: 1; --tint: #fff; }
  body.multi .cell { box-shadow: inset 0 0 0 2px #000a, inset 0 0 0 4px color-mix(in srgb, var(--tint) 55%, transparent); }

  .c-score { position: absolute; left: calc(30px * var(--s)); top: calc(18px * var(--s)); }
  .c-score-row { display: flex; align-items: center; gap: calc(12px * var(--s)); }
  .c-ico { font-size: calc(34px * var(--s)); filter: drop-shadow(0 3px 6px #0009); }
  .c-score-v {
    font-family: "Permanent Marker", cursive; font-size: calc(58px * var(--s)); line-height: 1; color: #fff;
    text-shadow: 0 0 2px #000, 3px 3px 0 #3a220c, 0 6px 18px #000c;
    font-variant-numeric: tabular-nums;
  }
  .c-best {
    font-family: "Permanent Marker", cursive; font-size: calc(17px * var(--s)); color: #ffcf4d;
    text-shadow: 0 0 2px #000, 2px 2px 0 #3a220c; margin: 6px 0 0 2px; letter-spacing: .06em;
  }
  body.multi .c-best { display: none; }
  .c-name {
    display: none; margin-top: calc(6px * var(--s));
    font-family: "Permanent Marker", cursive; font-size: calc(22px * var(--s)); color: var(--tint);
    text-shadow: 0 0 2px #000, 2px 2px 0 #000a; letter-spacing: .08em;
  }
  body.multi .c-name { display: block; }

  .c-lives { position: absolute; right: calc(24px * var(--s)); top: calc(16px * var(--s)); text-align: right; }
  .c-lives .x {
    font-family: "Permanent Marker", cursive; font-size: calc(44px * var(--s)); line-height: 1;
    color: #4fa7e8; -webkit-text-stroke: 1px #123; margin-left: calc(10px * var(--s));
    text-shadow: 0 0 2px #000, 2px 3px 0 #16273a, 0 5px 14px #000b;
    display: inline-block; transition: color .15s, transform .15s;
  }
  .c-lives .x.lost { color: #e8372b; text-shadow: 0 0 2px #000, 2px 3px 0 #3a1210, 0 5px 14px #000b;
                     transform: scale(1.12); }
  .c-practice {
    font-family: "Permanent Marker", cursive; font-size: calc(14px * var(--s)); color: #ffcf4d;
    text-shadow: 0 0 2px #000, 1px 2px 0 #3a220c; margin-top: 4px; letter-spacing: .08em; display: none;
  }
  body.practice .c-practice { display: block; }
  body.practice .c-lives .x { display: none; }

  /* Floating slice text. */
  .c-fx { position: absolute; inset: 0; overflow: hidden; }
  .splash {
    position: absolute; transform: translate(-50%, -50%);
    font-family: "Permanent Marker", cursive; white-space: nowrap;
    animation: splash-pop .95s ease-out forwards; will-change: transform, opacity;
  }
  .splash.plus { font-size: calc(46px * var(--s)); color: #fff; text-shadow: 0 0 2px #000, 2px 2px 0 #3a220c; }
  .splash.combo { font-size: calc(72px * var(--s)); color: #ffb52e;
    text-shadow: 0 0 3px #000, 3px 3px 0 #4a2a08, 0 0 26px #ffb52e88; }
  .splash.crit { font-size: calc(84px * var(--s)); color: #ffe14d;
    text-shadow: 0 0 3px #000, 3px 3px 0 #4a3708, 0 0 30px #ffe14daa; }
  .splash.penalty { font-size: calc(64px * var(--s)); color: #ff5040;
    text-shadow: 0 0 3px #000, 3px 3px 0 #3a0e08; }
  @keyframes splash-pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-6deg); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
    30%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -68%) scale(1); }
  }

  /* The red ✗ where a fruit hit the floor. */
  .c-miss {
    position: absolute; bottom: 16%; left: 50%; transform: translate(-50%, 0) scale(.3);
    font-family: "Permanent Marker", cursive; font-size: calc(96px * var(--s)); color: #e8372b;
    text-shadow: 0 0 4px #000, 4px 4px 0 #3a0e08; opacity: 0; pointer-events: none;
  }
  .c-miss.on { animation: miss-pop .75s ease-out forwards; }
  @keyframes miss-pop {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.3); }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1.25); }
    35%  { transform: translate(-50%, 0) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, 0) scale(1.05); }
  }

  /* Bomb hit: white-out, in that player's cell only. */
  .c-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .c-flash.on { animation: white-out .55s ease-out forwards; }
  @keyframes white-out { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* A player who is out watches the others finish. */
  .c-out {
    position: absolute; inset: 0; display: none; place-content: center; text-align: center;
    background: #1d1006b8; backdrop-filter: grayscale(.8) blur(1px);
    font-family: "Permanent Marker", cursive; color: #f5ead6;
  }
  .c-out.on { display: grid; }
  .c-out b { display: block; font-weight: 400; font-size: calc(84px * var(--s)); color: #e8372b;
    text-shadow: 0 0 4px #000, 4px 4px 0 #2a0a06; line-height: 1; }
  .c-out span { display: block; font-size: calc(26px * var(--s)); margin-top: calc(10px * var(--s)); }
  .c-out small { display: block; font-size: calc(15px * var(--s)); color: #b39468; margin-top: calc(8px * var(--s)); letter-spacing: .08em; }

  #link {
    position: absolute; right: 30px; bottom: 24px; display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: #d8c2a0; background: #1d1006cc; border: 1px solid #4a3319;
    padding: 9px 14px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b5638; }
  .dot.on { background: #35d07f; box-shadow: 0 0 10px #35d07f99; }

  #keys { position: absolute; left: 30px; bottom: 24px; font-size: 12px; color: #b39468; }
  #keys a { color: #b39468; text-decoration: none; pointer-events: auto; }
  #keys a:hover { color: #f5ead6; }
  #keys kbd {
    background: #1d1006; border: 1px solid #4a3319; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 11px; color: #d8c2a0;
  }

  #toast {
    position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; letter-spacing: .1em; color: #ffcf4d;
    text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .25s; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  #debug {
    position: absolute; right: 30px; top: 118px; margin: 0; display: none;
    background: #180d04dd; border: 1px solid #4a3319; border-radius: 12px;
    padding: 14px 16px; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #d8c2a0; white-space: pre;
  }
  #debug.on { display: block; }

  /* ── Overlays ────────────────────────────────────────────────────────── */
  #overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, #3a2410ee, #1d1106fa 70%);
    backdrop-filter: blur(3px); z-index: 5;
  }
  #overlay.hide { display: none; }
  .panel { text-align: center; max-width: 620px; padding: 0 32px; }
  .panel h1 {
    font-family: "Permanent Marker", cursive; font-size: 64px; margin: 0 0 10px;
    font-weight: 400; color: #fff; text-shadow: 0 0 3px #000, 4px 4px 0 #3a220c;
  }
  .panel h1 em { font-style: normal; color: #ffb52e; }
  .panel h1.gameover { color: #e8372b; font-size: 88px; letter-spacing: .02em;
    text-shadow: 0 0 4px #000, 5px 5px 0 #2a0a06, 0 0 44px #e8372b55; }
  .panel p { color: #d8c2a0; margin: 0 auto 26px; max-width: 460px; }

  .cta { margin-top: 26px; font-size: 14px; color: #b39468; }
  .cta strong { color: #f5ead6; }
  #final { font-family: "Permanent Marker", cursive; font-size: 26px; color: #f5ead6; }
  #final b { color: #ffcf4d; }
  .results { margin: 6px auto 4px; display: inline-block; text-align: left;
    font-family: "Permanent Marker", cursive; font-size: 26px; line-height: 1.7; }
  .results .row { display: flex; align-items: center; gap: 12px; }
  .results .row b { color: #ffcf4d; margin-left: auto; padding-left: 28px; font-weight: 400; }
  .results .row i { font-style: normal; color: #b39468; font-size: 15px; }
  .results .row.win { color: #fff; }
  .results .pdot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="cells"></div>
  <div id="keys">
    <a href="/" id="back">← Games</a> &nbsp;
    <kbd>Space</kbd> new game &nbsp; <kbd>C</kbd> re-center &nbsp;
    <kbd>←→</kbd> pointer speed &nbsp; <kbd>D</kbd> debug
  </div>
  <div id="link"><span class="dot" id="dot"></span><span id="link-t">no remote connected</span></div>
  <div id="toast"></div>
  <pre id="debug"></pre>
</div>

<div id="overlay" class="hide">
  <div class="panel" id="panel"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
